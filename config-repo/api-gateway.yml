server:
  port: ${GATEWAY_PORT:8080}
spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/,/index.html,/app.js,/styles.css,/favicon.ico,/api/users,/api/users/**,/swagger-ui.html,/swagger-ui/**,/v3/api-docs,/v3/api-docs/**,/v3/api-docs.yaml
              filters:
                - PreserveHostHeader
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/users
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
    loadbalancer:
      cache:
        ttl: 5s
resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      userService:
        timeout-duration: 4s
